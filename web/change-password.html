<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Изменить пароль — Strength Tracker</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="settings-screen">
  <div class="add-set-screen__header">
    <a href="account-security.html" class="add-set-screen__back" aria-label="Назад">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </a>
    <h1 class="screen-title add-set-screen__title">Изменить пароль</h1>
  </div>

  <form class="add-machine-form" id="change-password-form" novalidate>
    <div class="form-field">
      <label class="form-label" for="current-password">Текущий пароль</label>
      <input class="form-input" type="password" id="current-password" autocomplete="current-password" required>
    </div>

    <div class="form-field">
      <label class="form-label" for="new-password">Новый пароль</label>
      <input class="form-input" type="password" id="new-password" autocomplete="new-password" required>
    </div>

    <div class="form-field">
      <label class="form-label" for="confirm-password">Подтвердите новый пароль</label>
      <input class="form-input" type="password" id="confirm-password" autocomplete="new-password" required>
    </div>

    <p class="auth-error" id="error-message" style="display: none;"></p>

    <button class="btn btn--primary" type="submit">Сохранить</button>
  </form>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/change-password.js"></script>
</body>
</html>
