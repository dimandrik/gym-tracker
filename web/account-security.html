<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аккаунт и безопасность — Strength Tracker</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="settings-screen">
    <div class="add-set-screen__header">
        <a href="settings" class="add-set-screen__back" aria-label="Назад">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </a>
        <h1 class="screen-title add-set-screen__title">Аккаунт и безопасность</h1>
    </div>

    <div class="settings-section">
        <div class="settings-row settings-row--editable">
            <div>
                <p class="settings-row__label">Имя и фамилия</p>
                <p class="settings-row__value" id="current-name"></p>
            </div>
            <a href="change-name" class="settings-row__edit-link">изменить</a>
        </div>

        <div class="settings-row settings-row--editable">
            <div>
                <p class="settings-row__label">Email</p>
                <p class="settings-row__value" id="current-email"></p>
            </div>
            <a href="change-email" class="settings-row__edit-link">изменить</a>
        </div>

        <div class="settings-row settings-row--editable">
            <div>
                <p class="settings-row__label">Пароль</p>
                <p class="settings-row__value">••••••••</p>
            </div>
            <a href="change-password" class="settings-row__edit-link">изменить</a>
        </div>
    </div>

    <div class="settings-section">
        <button class="settings-row settings-row--danger" id="delete-account-btn">Удалить аккаунт</button>
    </div>

    <div class="confirm-modal" id="delete-account-modal" hidden>
        <div class="confirm-modal__backdrop" id="delete-account-backdrop"></div>
        <div class="confirm-modal__sheet">
            <h2 class="confirm-modal__title">Удалить аккаунт?</h2>
            <p class="confirm-modal__desc">Все тренажёры, история подходов и данные аккаунта будут удалены навсегда. Это действие нельзя отменить</p>

            <div class="form-field">
                <label class="form-label" for="delete-password">Введите пароль для подтверждения</label>
                <input class="form-input confirm-modal__password-input" type="password" id="delete-password" autocomplete="current-password">
            </div>

            <p class="auth-error" id="delete-error" style="display: none;"></p>

            <button class="confirm-modal__delete-btn" id="confirm-delete-account-btn">Удалить навсегда</button>
            <button class="confirm-modal__cancel-btn" id="cancel-delete-account-btn">Отмена</button>
        </div>
    </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/account-security.js"></script>
</body>
</html>
