<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр — Strength Tracker</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="machine-screen">

    <div class="machine-hero">
        <img class="machine-hero__photo" id="machine-photo">
        <div class="machine-hero__scrim"></div>
        <a href="index.html" class="machine-hero__back" aria-label="Назад">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </a>
        <div class="machine-hero__overlay">
            <h1 class="machine-hero__name" id="machine-name"></h1>
            <p class="machine-hero__record" id="machine-record"></p>
        </div>
    </div>

    <div class="history-list" id="history-list">

    </div>

    <div class="machine-screen__actions">
        <button class="machine-screen__edit-btn" id="edit-toggle-btn" aria-label="Изменить">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
            </svg>
            <span>изменить</span>
        </button>
        <a href="#" class="btn btn--primary machine-screen__add-btn" id="add-set-link">Добавить подход</a>
    </div>

</main>

<div class="confirm-modal" id="delete-confirm-modal" hidden>
    <div class="confirm-modal__backdrop" id="confirm-modal-backdrop"></div>
    <div class="confirm-modal__sheet">
        <h2 class="confirm-modal__title">Удалить подход?</h2>
        <p class="confirm-modal__desc" id="confirm-modal-desc"></p>
        <button class="confirm-modal__delete-btn" id="confirm-delete-btn">Удалить</button>
        <button class="confirm-modal__cancel-btn" id="confirm-cancel-btn">Отмена</button>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/machine.js"></script>
</body>
</html>
