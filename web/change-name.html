<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Изменить имя — Strength Tracker</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="settings-screen">
  <div class="add-set-screen__header">
    <a href="account-security" class="add-set-screen__back" aria-label="Назад">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </a>
    <h1 class="screen-title add-set-screen__title">Изменить имя</h1>
  </div>

  <form class="add-machine-form" id="change-name-form" novalidate>
    <div class="form-row">
      <div class="form-field">
        <label class="form-label" for="first-name">Имя</label>
        <input class="form-input" type="text" id="first-name" name="first_name" required>
      </div>
      <div class="form-field">
        <label class="form-label" for="last-name">Фамилия</label>
        <input class="form-input" type="text" id="last-name" name="last_name" required>
      </div>
    </div>

    <p class="auth-error" id="error-message" style="display: none;"></p>

    <button class="btn btn--primary" type="submit">Сохранить</button>
  </form>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/change-name.js"></script>
</body>
</html>
