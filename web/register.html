<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Strength Tracker</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="auth-screen">

    <div class="auth-logo">
        <span class="auth-logo__mark"></span>
    </div>

    <header class="auth-header">
        <h1 class="auth-title">Добро пожаловать</h1>
        <p class="auth-subtitle">Зарегистрируйтесь, чтобы продолжить</p>
    </header>

    <form class="auth-form" action="#" method="post" novalidate>

        <div class="form-row">
            <div class="form-field">
                <label class="form-label" for="first-name">Имя</label>
                <input
                        class="form-input"
                        type="text"
                        id="first-name"
                        name="first_name"
                        placeholder="Алексей"
                        autocomplete="given-name"
                        required
                >
            </div>
            <div class="form-field">
                <label class="form-label" for="last-name">Фамилия</label>
                <input
                        class="form-input"
                        type="text"
                        id="last-name"
                        name="last_name"
                        placeholder="Иванов"
                        autocomplete="family-name"
                        required
                >
            </div>
        </div>

        <div class="form-field">
            <label class="form-label" for="email">Email</label>
            <input
                    class="form-input"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
            >
        </div>

        <div class="form-field">
            <label class="form-label" for="password">Пароль</label>
            <input
                    class="form-input"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="new-password"
                    required
            >
        </div>
        <p class="auth-error" id="error-message" style="display: none;"></p>

        <button class="btn btn--primary" type="submit">Зарегистрироваться</button>

    </form>

    <p class="auth-switch">
        Уже есть аккаунт?
        <a class="auth-switch__link" href="login">Войти</a>
    </p>

</main>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/register.js"></script>
</body>
</html>
