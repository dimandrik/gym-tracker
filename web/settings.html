<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки — Strength Tracker</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="settings-screen">
    <div class="add-set-screen__header">
        <a href="index.html" class="add-set-screen__back" aria-label="Назад">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </a>
        <h1 class="screen-title add-set-screen__title">Настройки</h1>
    </div>

    <div class="settings-profile">
        <button type="button" class="settings-avatar" id="settings-avatar" aria-label="Изменить фото профиля">
            <img class="settings-avatar__photo" id="settings-avatar-photo" alt="" hidden>
            <span id="settings-avatar-initial"></span>
        </button>
        <div>
            <p class="settings-profile__name" id="settings-name"></p>
            <p class="settings-profile__email" id="settings-email"></p>
        </div>
    </div>

    <div class="settings-section">
        <p class="settings-section__title">Аккаунт</p>
        <a href="account-security.html" class="settings-row">
            <span>Аккаунт и безопасность</span>
            <span class="settings-row__arrow">›</span>
        </a>
    </div>

    <div class="settings-section">
        <p class="settings-section__title">О приложении</p>
        <div class="settings-row settings-row--static">
            <span>Версия</span>
            <span class="settings-row__value">1.0.0</span>
        </div>
    </div>

    <button class="btn btn--danger settings-logout-btn" id="logout-btn">Выйти из аккаунта</button>

    <div class="confirm-modal" id="logout-modal" hidden>
        <div class="confirm-modal__backdrop" id="logout-backdrop"></div>
        <div class="confirm-modal__sheet">
            <h2 class="confirm-modal__title">Выйти из аккаунта?</h2>
            <p class="confirm-modal__desc">Данные сохранены — при следующем входе всё будет на месте</p>

            <button class="confirm-modal__delete-btn" id="confirm-logout-btn">Выйти</button>
            <button class="confirm-modal__cancel-btn" id="cancel-logout-btn">Отмена</button>
        </div>
    </div>

    <div class="confirm-modal" id="photo-sheet" hidden>
        <div class="confirm-modal__backdrop" id="photo-sheet-backdrop"></div>
        <div class="photo-sheet__sheet">
            <div class="photo-sheet__header">
                <div class="settings-avatar photo-sheet__avatar" id="photo-sheet-avatar">
                    <img class="settings-avatar__photo" id="photo-sheet-avatar-photo" alt="" hidden>
                    <span id="photo-sheet-avatar-initial"></span>
                </div>
                <div>
                    <p class="photo-sheet__title">Фото профиля</p>
                    <p class="photo-sheet__name" id="photo-sheet-name"></p>
                </div>
            </div>

            <button type="button" class="photo-sheet__option photo-sheet__option--primary" id="photo-take-btn">Сделать снимок</button>
            <button type="button" class="photo-sheet__option" id="photo-gallery-btn">Выбрать из галереи</button>
            <button type="button" class="photo-sheet__option photo-sheet__option--danger" id="photo-delete-btn">Удалить фото</button>

            <button type="button" class="photo-sheet__cancel" id="photo-sheet-cancel">Отмена</button>
        </div>
    </div>

    <input type="file" accept="image/*" capture="environment" id="photo-camera-input" hidden>
    <input type="file" accept="image/*" id="photo-gallery-input" hidden>

</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
