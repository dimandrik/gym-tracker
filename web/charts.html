<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графики — Strength Tracker</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="machine-screen">
    <div class="add-set-screen__header">
        <a href="#" class="add-set-screen__back" id="back-link" aria-label="Назад">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </a>
        <div>
            <h1 class="screen-title add-set-screen__title">Графики</h1>
            <p class="add-set-screen__machine-name" id="chart-subtitle"></p>
        </div>
    </div>

    <div class="chart-tabs">
        <button class="chart-tab chart-tab--active" data-tab="scatter">Карта</button>
        <button class="chart-tab" data-tab="progress">Прогресс</button>
        <button class="chart-tab" data-tab="volume">Объём</button>
        <button class="chart-tab" data-tab="frequency">Частота</button>
    </div>

    <div class="chart-range-tabs">
        <button class="chart-range-tab" data-range="week">Неделя</button>
        <button class="chart-range-tab chart-range-tab--active" data-range="month">Месяц</button>
        <button class="chart-range-tab" data-range="3m">3 мес</button>
        <button class="chart-range-tab" data-range="year">Год</button>
        <button class="chart-range-tab" data-range="all">Всё</button>
    </div>

    <div class="chart-content" id="chart-content"></div>

</main>

<div class="confirm-modal" id="point-detail-modal" hidden>
    <div class="confirm-modal__backdrop" id="point-detail-backdrop"></div>
    <div class="confirm-modal__sheet">
        <h2 class="confirm-modal__title chart-point-modal__title" id="point-detail-title"></h2>
        <ul class="chart-point-modal__list" id="point-detail-list"></ul>
        <button class="confirm-modal__cancel-btn" id="point-detail-close-btn">Закрыть</button>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/charts.js"></script>
</body>
</html>
