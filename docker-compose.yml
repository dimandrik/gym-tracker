services:
  postgres:
    image: postgres:16
    container_name: gym_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - gym_tracker_data:/var/lib/postgresql/data

volumes:
  gym_tracker_data:
