services:
  postgres:
    image: postgres:16
    container_name: gym_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_pass
      POSTGRES_DB: gym_tracker
    ports:
      - "5432:5432"
    volumes:
      - gym_tracker_data:/var/lib/postgresql/data

volumes:
  gym_tracker_data:
